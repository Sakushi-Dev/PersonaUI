# ══════════════════════════════════════════════════════════════════════
#  PersonaUI – Launch Options
# ══════════════════════════════════════════════════════════════════════
#
#  Startoptionen für PersonaUI. Werte werden beim App-Start geladen.
#  Kommentare mit # oder ; möglich.
#

[app]
# Startet ohne PyWebView-Fenster (reiner Browser-Modus)
no_gui = false

# Aktiviert den Vite Dev-Server für Live-HMR (Port 5173)
dev_mode = false

# Erzwingt npm run build auch wenn dist/ existiert
force_build = false

[server]
# Server-Port für die Flask-App
port = 5000

# Host-Binding: 127.0.0.1 = nur dieser PC, 0.0.0.0 = auch von anderen Geräten im LAN erreichbar
host = 127.0.0.1

[startup]
# Automatisch nach Updates suchen beim Start
check_updates = true

# Splash-Screen anzeigen (nur mit GUI)
show_splash = true

# Konsolen-Fenster sichtbar lassen (nur Windows)
show_console = false

[dev]
# Vite Dev-Server Port
vite_port = 5173

# Log-Level: debug, info, warning, error
log_level = info
